<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="profile-image">
            <img src="https://ui-avatars.com/api/?name=Abdullah+Aslam&background=4f46e5&color=fff&size=200"
                alt="Profile">
        </div>

        <h1 id="name"></h1>

        <p id="course"></p>

        <div class="details">

            <p id="age"></p>

            <p id="city"></p>

            <p id="country"></p>

            <p id="status"></p>

        </div>

        <button id="toggleBtn">
            Show Details
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
